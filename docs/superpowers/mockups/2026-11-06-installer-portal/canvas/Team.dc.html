<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F7FB}
a{color:#3C51C4}a:hover{color:#22376B}
</style>
</helmet>
<div style="min-height: 860px; display: flex; flex-wrap: wrap; font-family: 'Open Sans', Arial, sans-serif; color: #22376B; background: #F5F7FB">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 240px; min-width: 200px; background: #FFFFFF; border-right: 1px solid #E3E8F2; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<img src="/_blob/3bbf4febd79e89c461ef7e11e5cfb335" alt="Home Insulation Victoria" style="width: 120px; height: auto; margin: 0 8px 24px">
<a href="AddJob.dc.html" style="display: block; text-align: center; background: #3C51C4; color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 12px; border-radius: 10px; text-decoration: none; margin-bottom: 14px">+ Add a job</a>
<a href="Main.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; font-size: 15px; text-decoration: none; color: #22376B; font-weight: 600">Action items<span style="background: #3C51C4; color: #FFFFFF; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 2px 9px">4</span></a>
<a href="Calendar.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; font-size: 15px; text-decoration: none; color: #22376B; font-weight: 600">Calendar</a>
<a href="Jobs.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; font-size: 15px; text-decoration: none; color: #22376B; font-weight: 600">Jobs</a>
<a href="Money.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; font-size: 15px; text-decoration: none; color: #22376B; font-weight: 600">Money</a>
<a href="Business.dc.html" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 10px; font-size: 15px; text-decoration: none; background: #EAEEFB; color: #3C51C4; font-weight: 700">My business</a>
<div style="flex-grow: 1"></div>
<div style="padding: 12px 14px; font-size: 13px; color: #5B6785; line-height: 1.5"><b style="color: #22376B">Reinsulate</b><br>Deep Singh</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 40px 48px; box-sizing: border-box">
<a href="Business.dc.html" style="font-size: 14px; font-weight: 600; text-decoration: none">‹ My business</a>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 10px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.5px">Team</h1>
<a href="#" style="background: #3C51C4; color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 13px 20px; border-radius: 10px; text-decoration: none">+ Add a person</a>
</div>

<div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; margin-top: 28px">
<div style="flex: 3 1 440px; min-width: 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<h2 style="margin: 0 0 12px; font-size: 15px; font-weight: 700; color: #5B6785">{{g.title}}</h2>
<div style="background: #FFFFFF; border: 1px solid #E3E8F2; border-radius: 14px; overflow: hidden; margin-bottom: 28px">
<sc-for list="{{g.people}}" as="p" hint-placeholder-count="2">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">
<span style="min-width: 0">
<span style="display: block; font-size: 17px; font-weight: 700; color: #22376B">{{p.name}}</span>
<span style="display: block; font-size: 14px; color: #5B6785; margin-top: 2px">{{p.role}}</span>
</span>
<span style="font-size: 14px; font-weight: 700; white-space: nowrap; color: {{p.statusInk}}">{{p.status}}</span>
</button>
</sc-for>
</div>
</sc-for>
</div>

<aside style="flex: 2 1 320px; min-width: 280px; background: #FFFFFF; border: 1px solid #E3E8F2; border-radius: 14px; padding: 24px">
<h2 style="margin: 0; font-size: 22px; font-weight: 800">{{sel.name}}</h2>
<div style="font-size: 14px; color: #5B6785; margin-top: 2px">{{sel.role}}</div>

<sc-if value="{{sel.fix}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #FEF3E2; color: #8A4B00; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 12px">{{sel.fix}}<a href="#" style="color: #8A4B00; white-space: nowrap">{{sel.fixBtn}}</a></div>
</sc-if>

<sc-if value="{{sel.notElec}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: 20px; font-size: 13px; font-weight: 700">Goes to jobs as</div>
<div role="radiogroup" aria-label="Goes to jobs as" style="display: flex; gap: 8px; margin-top: 8px">
<button type="button" role="radio" aria-checked="{{sel.isLead}}" onClick="{{setLead}}" style="{{leadStyle}}">Lead Installer</button>
<button type="button" role="radio" aria-checked="{{sel.isCrew}}" onClick="{{setCrew}}" style="{{crewStyle}}">Crew</button>
</div>
<p style="margin: 8px 0 0; font-size: 13px; color: #5B6785; line-height: 1.5">{{roleNote}}</p>
</sc-if>

<div style="margin-top: 20px; border-top: 1px solid #E3E8F2">
<sc-for list="{{sel.rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E3E8F2; font-size: 14px"><span style="color: #5B6785">{{r.k}}</span><span style="font-weight: 700; text-align: right; color: {{r.ink}}">{{r.v}}</span></div>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px">
<a href="#" style="font-size: 14px; font-weight: 700">Edit details</a>
<a href="#" style="font-size: 14px; font-weight: 600; color: #B42318">Remove from team</a>
</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'tom', roles: { tom: 'Lead', deep: 'Lead', raj: 'Crew', wayne: 'Crew', james: 'Elec', peter: 'Elec' } };
  }
  renderVals() {
    const OK = '#067A40', WARN = '#8A4B00';
    const base = [
      { id: 'tom', name: 'Tom Lowe', boss: true, mobile: '0473 541 226', cii: 'Expires 18 Dec 2026', esc: 'Registered', fix: '', fixBtn: '' },
      { id: 'deep', name: 'Deep Singh', boss: false, mobile: '0412 300 118', cii: 'Expires 2 Mar 2027', esc: 'Registered', fix: '', fixBtn: '' },
      { id: 'raj', name: 'Raj Kumar', boss: false, mobile: '', cii: 'Expires 9 Jun 2027', esc: 'Not needed', fix: 'Missing: mobile number', fixBtn: 'Add mobile' },
      { id: 'wayne', name: 'Wayne Fletcher', boss: false, mobile: '0433 220 914', cii: 'Expires Wed 11 Nov', esc: 'Not needed', fix: 'Missing: new CII (expires in 5 days)', fixBtn: 'Upload CII' },
      { id: 'james', name: 'James Spark', boss: false, elec: true, mobile: '0400 118 552', licence: 'Expires 4 Aug 2027', rec: 'REC 31244', ins: 'Expires 30 Jun 2027', fix: '', fixBtn: '' },
      { id: 'peter', name: 'Peter Orlando', boss: false, elec: true, mobile: '0421 777 301', licence: 'Expires 1 Feb 2027', rec: 'REC 28810', ins: 'Missing', fix: 'Missing: public liability insurance', fixBtn: 'Upload' }
    ];
    const roles = this.state.roles;
    const people = base.map(p => {
      const lead = roles[p.id] === 'Lead';
      const role = p.elec ? 'Electrician' : (p.boss ? 'Boss · ' : '') + (lead ? 'Lead Installer' : 'Crew');
      const chosen = this.state.sel === p.id;
      return Object.assign({}, p, {
        lead, role, notElec: !p.elec,
        isLead: lead ? 'true' : 'false', isCrew: lead ? 'false' : 'true',
        status: p.fix ? p.fix : 'Approved ✓',
        statusInk: p.fix ? WARN : OK,
        pick: () => this.setState({ sel: p.id }),
        style: 'width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; border: 0; border-bottom: 1px solid #E3E8F2; font-family: inherit; text-align: left; cursor: pointer; background: ' + (chosen ? '#F0F3FC' : '#FFFFFF'),
        rows: p.elec ? [
          { k: 'Mobile', v: p.mobile, ink: '#22376B' },
          { k: 'Electrical licence', v: p.licence, ink: '#22376B' },
          { k: 'REC', v: p.rec, ink: '#22376B' },
          { k: 'Public liability', v: p.ins, ink: p.ins === 'Missing' ? WARN : '#22376B' }
        ] : [
          { k: 'Mobile', v: p.mobile || 'Missing', ink: p.mobile ? '#22376B' : WARN },
          { k: 'CII', v: p.cii, ink: p.fix && p.id === 'wayne' ? WARN : '#22376B' },
          { k: 'ESC', v: lead ? p.esc : 'Not needed', ink: '#22376B' },
          { k: 'Date of birth', v: 'On file', ink: '#22376B' },
          { k: 'Mitti', v: lead ? 'Yes' : 'No', ink: '#22376B' }
        ]
      });
    });
    const sel = people.find(p => p.id === this.state.sel);
    const setRole = r => () => this.setState({ roles: Object.assign({}, roles, { [sel.id]: r }) });
    const seg = on => 'flex: 1; min-height: 44px; font-family: inherit; font-size: 15px; font-weight: 700; border-radius: 10px; cursor: pointer; ' + (on ? 'background: #22376B; color: #FFFFFF; border: 1px solid #22376B' : 'background: #FFFFFF; color: #22376B; border: 1px solid #CED6E6');
    return {
      groups: [
        { title: 'Lead Installers', people: people.filter(p => !p.elec && p.lead) },
        { title: 'Crew', people: people.filter(p => !p.elec && !p.lead) },
        { title: 'Electricians', people: people.filter(p => p.elec) }
      ],
      sel,
      leadStyle: seg(sel.lead), crewStyle: seg(!sel.lead),
      roleNote: sel.lead ? 'Runs install days and signs the install form. Gets Mitti.' : 'Works on install days. No Mitti.',
      setLead: setRole('Lead'), setCrew: setRole('Crew')
    };
  }
}
</script>
</body>
</html>
